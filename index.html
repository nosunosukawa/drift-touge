<canvas id="c"></canvas><div id="sa"></div>
<script>
'use strict';
/* ===== 純粋部分（DOM を触らない）: コース生成・物理・採点 ===== */
var Core=(function(){
  var DS=8, HALF_W=85, CAR_R=13, TAU=Math.PI*2, UP=-Math.PI/2, LP=0.22;
  var P={a:15,b:15,k2:260,GF:270,GR:312,CA:7,VMAX:440,ACC:340,HB_GRIP:0.3,HB_BRAKE:230,LIFT:0.45,LIFT_V0:120,LIFT_VR:120,SLIDE:0.85,FALL:0.05,YAWD:1.8,US_BRAKE:250,US_TH:1.3,PS:0.3,DRIFT_MIN_ANGLE:0.21,DRIFT_MIN_SPEED:130,NEAR:22,PLAY_TIME:60};
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function angDiff(a,b){var d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
  function hashStr(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function dateSeed(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function Rng(seed){this.s=seed>>>0;}
  Rng.prototype.next=function(){var t=this.s=(this.s+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};

  /* --- コース --- */
  function makeCourse(seedStr){
    var c={seed:seedStr,seedN:hashStr('touge:'+seedStr),x:[],y:[],h:[],k:[],trees:[],halfW:HALF_W,ds:DS,px:0,py:0,ph:UP,pk:0,treeAt:0};
    c.rng=new Rng(c.seedN);
    for(var i=0;i<56;i++){c.py-=DS;c.x.push(c.px);c.y.push(c.py);c.h.push(UP);c.k.push(0);}
    return c;
  }
  function pickSeg(r,rel){
    var segs=[],LIM=1.32,u=r.next();
    var sgn=rel>0.3?-1:rel<-0.3?1:(r.next()<0.5?-1:1);
    function arc(R,ang,s){var t=clamp(rel+s*ang,-LIM,LIM),a=Math.abs(t-rel);if(a<0.2)return;segs.push([s/R,Math.max(3,Math.round(a*R/DS))]);rel=t;}
    function st(n){segs.push([0,n]);}
    if(u<0.12){st(10+Math.floor(r.next()*18));}
    else if(u<0.40){arc(108+r.next()*30,1.9+r.next()*0.8,sgn);st(6+Math.floor(r.next()*10));}
    else if(u<0.64){var R=150+r.next()*90,a=0.7+r.next()*0.6;arc(R,a,sgn);arc(R*(0.8+0.4*r.next()),a*(1.3+0.7*r.next()),-sgn);st(3+Math.floor(r.next()*6));}
    else if(u<0.84){arc(170+r.next()*90,0.9+r.next()*0.8,sgn);st(4+Math.floor(r.next()*8));}
    else{arc(330+r.next()*200,0.5+r.next()*0.6,sgn);st(2+Math.floor(r.next()*6));}
    if(!segs.length)st(8);
    return segs;
  }
  function isClear(c,tx,ty){
    var n=c.x.length,lo=Math.max(0,n-520),min2=196*196;
    for(var j=0;j<tx.length;j++){var gi=n+j,qx=tx[j],qy=ty[j];
      for(var i=lo;i<gi-55;i++){var dx=(i<n?c.x[i]:tx[i-n])-qx,dy=(i<n?c.y[i]:ty[i-n])-qy;if(dx*dx+dy*dy<min2)return false;}}
    return true;
  }
  function addSeg(c){
    for(var tries=0;tries<10;tries++){
      var pend=c.pk*DS*(1-LP)/LP, rel=angDiff(c.ph,UP)+pend;
      var segs=tries<9?pickSeg(c.rng,rel):[[0,10]];
      var x=c.px,y=c.py,h=c.ph,k=c.pk,tx=[],ty=[],th=[],tk=[];
      for(var s=0;s<segs.length;s++){for(var i=0;i<segs[s][1];i++){k+=(segs[s][0]-k)*LP;h+=k*DS;x+=Math.cos(h)*DS;y+=Math.sin(h)*DS;tx.push(x);ty.push(y);th.push(h);tk.push(k);}}
      if(tries<9&&(Math.abs(angDiff(h,UP)+k*DS*(1-LP)/LP)>1.42||!isClear(c,tx,ty)))continue;
      for(var j=0;j<tx.length;j++){c.x.push(tx[j]);c.y.push(ty[j]);c.h.push(th[j]);c.k.push(tk[j]);}
      c.px=x;c.py=y;c.ph=h;c.pk=k;return;
    }
  }
  function hv(c,i,s){return new Rng((c.seedN^Math.imul(i+1,2654435761))+s*977).next();}
  function plantTrees(c){
    var n=c.x.length;
    for(var i=c.treeAt;i<n-130;i++){
      c.treeAt=i+1;if(i%3!==0)continue;
      for(var side=-1;side<=1;side+=2){
        if(hv(c,i,side+2)>0.6)continue;
        var r=13+hv(c,i,side+5)*15,d=HALF_W+28+r+hv(c,i,side+8)*150;
        var tx=c.x[i]-Math.sin(c.h[i])*side*d,ty=c.y[i]+Math.cos(c.h[i])*side*d,ok=true,m=HALF_W+r+14;
        for(var j=Math.max(0,i-130);j<i+130;j++){var dx=c.x[j]-tx,dy=c.y[j]-ty;if(dx*dx+dy*dy<m*m){ok=false;break;}}
        if(ok)c.trees.push({x:tx,y:ty,r:r,i:i,t:hv(c,i,side+11)});
      }
    }
  }
  function ensure(c,n){var g=0;while(c.x.length<n+140&&g++<20000)addSeg(c);plantTrees(c);}

  /* --- クルマ（前後輪の横グリップを分けた自転車モデル） --- */
  function tire(x){var ax=Math.abs(x),f=ax<1?ax:Math.max(P.SLIDE,1-P.FALL*(ax-1));return x<0?-f:f;}
  function stepCar(car,inp,dt){
    var st=clamp(inp.steer||0,-1,1),hb=!!inp.hb;
    var rate=7*dt;car.steer+=clamp(st-car.steer,-rate,rate);
    var cs=Math.cos(car.h),sn=Math.sin(car.h);
    var vf=car.vx*cs+car.vy*sn,vl=-car.vx*sn+car.vy*cs,sp=Math.hypot(car.vx,car.vy);
    var beta=sp>15?angDiff(Math.atan2(car.vy,car.vx),car.h):0;
    var ab=Math.abs(beta);
    var maxSteer=0.5-0.22*clamp(sp/P.VMAX,0,1)+0.27*clamp(ab/0.6,0,1);
    var delta=car.steer*maxSteer;
    var vfc=Math.max(Math.abs(vf),90);
    var af=Math.atan2(vl+car.w*P.a,vfc)-delta,ar=Math.atan2(vl-car.w*P.b,vfc);
    var lift=Math.max(0,car.steer*clamp(car.w/1.2,-1,1))*clamp((sp-P.LIFT_V0)/P.LIFT_VR,0,1);
    var gr=P.GR*(1-P.LIFT*lift)*(1-P.PS*clamp((ab-0.12)/0.35,0,1)*clamp((sp-100)/100,0,1));if(hb)gr*=P.HB_GRIP;
    var fade=clamp(sp/60,0,1);
    var Ff=-P.GF*tire(P.CA*af)*fade,Fr=-gr*tire(P.CA*ar)*fade;
    var us=clamp(Math.abs(P.CA*af)-P.US_TH,0,1)*(1-clamp((ab-0.1)/0.1,0,1))*fade;
    var drive=hb?0:P.ACC*clamp((P.VMAX-vf)/90,0,1)*(1-us);
    var aF=drive-Ff*Math.sin(delta)-0.12*vf,aL=Ff*Math.cos(delta)+Fr;
    car.vx+=(aF*cs-aL*sn)*dt;car.vy+=(aF*sn+aL*cs)*dt;
    if((hb||us>0)&&sp>1){var b=Math.min(sp,((hb?P.HB_BRAKE:0)+P.US_BRAKE*us)*dt);car.vx-=car.vx/sp*b;car.vy-=car.vy/sp*b;}
    car.w+=((P.a*Ff*Math.cos(delta)-P.b*Fr)/P.k2-P.YAWD*car.w)*dt;
    car.h+=car.w*dt;car.x+=car.vx*dt;car.y+=car.vy*dt;
    car.sp=Math.hypot(car.vx,car.vy);
    car.beta=car.sp>15?angDiff(Math.atan2(car.vy,car.vx),car.h):0;
    car.delta=delta;car.hb=hb;car.slipR=Math.abs(P.CA*ar)*fade;car.slipF=Math.abs(P.CA*af)*fade;
  }
  function locate(c,car){
    var i=car.ci,dx=car.x-c.x[i],dy=car.y-c.y[i],b=dx*dx+dy*dy,n;
    for(;;){if(i+2>=c.x.length)ensure(c,i+300);dx=car.x-c.x[i+1];dy=car.y-c.y[i+1];n=dx*dx+dy*dy;if(n<b){b=n;i++;}else break;}
    while(i>0){dx=car.x-c.x[i-1];dy=car.y-c.y[i-1];n=dx*dx+dy*dy;if(n<b){b=n;i--;}else break;}
    car.ci=i;ensure(c,i+300);
    var th=c.h[i];dx=car.x-c.x[i];dy=car.y-c.y[i];
    car.lat=-dx*Math.sin(th)+dy*Math.cos(th);car.th=th;
  }
  function makeGame(seedStr){
    var course=makeCourse(seedStr);ensure(course,400);
    var car={x:course.x[8],y:course.y[8],h:course.h[8],vx:0,vy:0,w:0,steer:0,ci:8,lat:0,th:UP,beta:0,sp:0,slipR:0,slipF:0,hb:false,delta:0};
    car.vx=Math.cos(car.h)*150;car.vy=Math.sin(car.h)*150;car.sp=150;
    return {course:course,car:car,t:P.PLAY_TIME,over:false,score:0,mult:1,chain:0,chainPts:0,grace:0,drifting:false,near:false,nearT:0,
      hits:0,hitCd:0,longest:0,maxMult:1,topSp:0,wrongT:0,events:[]};
  }
  function endChain(g){if(g.chain>g.longest)g.longest=g.chain;g.chain=0;g.chainPts=0;g.mult=1;g.grace=0;}
  function step(g,inp,dt){
    if(g.over)return;
    var car=g.car,c=g.course;
    stepCar(car,inp,dt);locate(c,car);
    var contact=false,lim=HALF_W-CAR_R,over=Math.abs(car.lat)-lim;
    if(g.hitCd>0)g.hitCd-=dt;
    if(over>0){
      var s=car.lat>0?1:-1,nx=-Math.sin(car.th)*s,ny=Math.cos(car.th)*s;
      car.x-=nx*over;car.y-=ny*over;car.lat=s*lim;
      var vn=car.vx*nx+car.vy*ny;
      if(vn>0){contact=true;car.vx-=nx*vn*1.35;car.vy-=ny*vn*1.35;
        if(g.hitCd<=0){g.hits++;g.hitCd=0.5;var k=vn>35?0.5:0.8;car.vx*=k;car.vy*=k;car.w*=0.3;car.h+=angDiff(car.th,car.h)*0.4;g.events.push({type:'hit',power:clamp(vn/250,0.2,1)});endChain(g);}
        else{var f=1-2.5*dt;car.vx*=f;car.vy*=f;endChain(g);}
      }
    }
    /* 逆走したら向きを戻す */
    if(Math.cos(angDiff(car.h,car.th))<-0.1){g.wrongT+=dt;if(g.wrongT>0.9){car.h+=angDiff(car.th,car.h)*Math.min(1,4*dt);car.w*=0.9;}}else g.wrongT=0;
    car.sp=Math.hypot(car.vx,car.vy);
    var ab=Math.abs(car.beta),wd=lim-Math.abs(car.lat);
    var drifting=!contact&&car.sp>P.DRIFT_MIN_SPEED&&ab>P.DRIFT_MIN_ANGLE&&ab<2.0;
    g.drifting=drifting;g.near=drifting&&wd<P.NEAR;
    if(drifting){
      g.chain+=dt;g.grace=0.7;
      var m=Math.min(10,1+Math.floor(g.chain/1.2));
      if(m>g.mult){g.mult=m;g.events.push({type:'combo',mult:m});if(m>g.maxMult)g.maxMult=m;}
      var pts=(ab*57.3)*(car.sp/100)*1.2*g.mult*(g.near?2:1)*dt;
      g.score+=pts;g.chainPts+=pts;if(g.near)g.nearT+=dt;
      if(g.chain>g.longest)g.longest=g.chain;
    }else if(g.chain>0){g.grace-=dt;if(g.grace<=0)endChain(g);}
    if(car.sp>g.topSp)g.topSp=car.sp;
    g.t-=dt;if(g.t<=0){g.t=0;g.over=true;if(g.chain>g.longest)g.longest=g.chain;}
  }
  var RANKS=[[0,'若葉マーク'],[2000,'峠の常連'],[5000,'コーナーの職人'],[10000,'横滑りの達人'],[18000,'峠のぬし']];
  function rank(score){var r=RANKS[0][1];for(var i=0;i<RANKS.length;i++)if(score>=RANKS[i][0])r=RANKS[i][1];return r;}
  function kmh(sp){return sp*0.36;}
  return {P:P,DS:DS,HALF_W:HALF_W,CAR_R:CAR_R,clamp:clamp,angDiff:angDiff,dateSeed:dateSeed,makeCourse:makeCourse,ensure:ensure,makeGame:makeGame,step:step,stepCar:stepCar,rank:rank,RANKS:RANKS,kmh:kmh};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=Core;

/* ===== 画面・入力・音 ===== */
if(typeof document!=='undefined'){(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var cw=0,ch=0,dpr=1,safe={t:0,r:0,b:0,l:0};
  var clamp=Core.clamp,angDiff=Core.angDiff,P=Core.P,HW=Core.HALF_W,DS=Core.DS;
  var STEP=1/120,FONT="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif";
  var seed=Core.dateSeed(),g=Core.makeGame(seed);
  var screen='title',countT=0,countN=0,resultT=0,goT=0,acc=0,last=0,paused=false,now=0;
  var best=0,newBest=false;
  try{best=parseInt(localStorage.getItem('driftTouge.best')||'0',10)||0;}catch(e){best=0;}
  var cam={x:g.car.x,y:g.car.y,a:g.car.h,z:1},shake=0,comboPulse=0,hitFlash=0;
  var smoke=[],treePtr=0;
  var btn={mute:{x:0,y:0,w:44,h:44},retry:{x:0,y:0,w:0,h:0},share:{x:0,y:0,w:0,h:0}};

  /* --- タイヤ痕用の別キャンバス --- */
  var SKN=1024,SKS=0.5;
  function mk(){var c=document.createElement('canvas');c.width=SKN;c.height=SKN;return c;}
  var skA=mk(),skB=mk(),skAc=skA.getContext('2d'),skBc=skB.getContext('2d'),skOx=0,skOy=0,prevW=null;
  function skidRecenter(force){
    var half=SKN/SKS/2;
    if(force||Math.abs(g.car.x-(skOx+half))>half-460||Math.abs(g.car.y-(skOy+half))>half-460){
      var nox=g.car.x-half,noy=g.car.y-half;
      skBc.setTransform(1,0,0,1,0,0);skBc.clearRect(0,0,SKN,SKN);
      if(!force)skBc.drawImage(skA,(skOx-nox)*SKS,(skOy-noy)*SKS);
      var t=skA;skA=skB;skB=t;t=skAc;skAc=skBc;skBc=t;skOx=nox;skOy=noy;
    }
  }
  function skidAmount(){
    var car=g.car,a=clamp((Math.abs(car.beta)-0.12)/0.45,0,1)*clamp(car.sp/150,0,1);
    a=Math.max(a,clamp((car.slipR-1)/1.5,0,1)*clamp(car.sp/150,0,1));
    if(car.hb&&car.sp>50)a=Math.max(a,0.7);
    return screen==='play'?a:0;
  }

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);cw=window.innerWidth||320;ch=window.innerHeight||480;
    cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
    try{var s=getComputedStyle(document.getElementById('sa'));safe.t=parseFloat(s.paddingTop)||0;safe.r=parseFloat(s.paddingRight)||0;safe.b=parseFloat(s.paddingBottom)||0;safe.l=parseFloat(s.paddingLeft)||0;}catch(e){}
  }

  /* --- 入力 --- */
  var ptr=new Map(),keys={l:false,r:false,hb:false},lastSteer=0;
  function inputNow(){
    var l=keys.l,r=keys.r;ptr.forEach(function(s){if(s<0)l=true;else r=true;});
    if((l&&r)||keys.hb){var st=(l&&r)?lastSteer:((r?1:0)-(l?1:0));return {steer:st,hb:true};}
    lastSteer=(r?1:0)-(l?1:0);return {steer:lastSteer,hb:false};
  }
  function hit(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
  cv.addEventListener('pointerdown',function(e){
    if(hit(btn.mute,e.clientX,e.clientY))return;
    ptr.set(e.pointerId,e.clientX<cw/2?-1:1);
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    if(e.cancelable)e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){if(ptr.has(e.pointerId))ptr.set(e.pointerId,e.clientX<cw/2?-1:1);});
  function pUp(e){ptr.delete(e.pointerId);}
  cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
  cv.addEventListener('click',function(e){
    audioInit();var x=e.clientX,y=e.clientY;
    if(hit(btn.mute,x,y)){toggleMute();return;}
    if(screen==='title')startCount();
    else if(screen==='result'&&resultT>0.8){if(hit(btn.retry,x,y))startCount();else if(hit(btn.share,x,y))share();}
  });
  window.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=true;e.preventDefault();}
    else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=true;e.preventDefault();}
    else if(k===' '||k==='Enter'){e.preventDefault();
      if(!e.repeat&&(screen==='title'||(screen==='result'&&resultT>0.8))){audioInit();startCount();}
      else if(k===' ')keys.hb=true;}
    else if(k==='m'||k==='M'){toggleMute();}
  });
  window.addEventListener('keyup',function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;
    else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false;
    else if(k===' ')keys.hb=false;
  });
  function clearInput(){ptr.clear();keys.l=keys.r=keys.hb=false;}
  window.addEventListener('blur',clearInput);
  ['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart','dragstart'].forEach(function(n){
    document.addEventListener(n,function(e){if(n==='touchstart'||n==='touchend')return;if(e.cancelable)e.preventDefault();},{passive:false});
  });
  document.addEventListener('visibilitychange',function(){
    paused=!!document.hidden;clearInput();
    if(AC){try{if(paused)AC.suspend();else AC.resume();}catch(e){}}
  });
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);

  /* --- 音（WebAudio で合成） --- */
  var AC=null,A=null,muted=false;
  function audioInit(){
    if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    try{
      AC=new C();var m=AC.createGain();m.gain.value=muted?0:0.55;m.connect(AC.destination);
      var o1=AC.createOscillator();o1.type='sawtooth';var o2=AC.createOscillator();o2.type='square';
      var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
      var eg=AC.createGain();eg.gain.value=0;var g2=AC.createGain();g2.gain.value=0.5;
      o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(eg);eg.connect(m);o1.start();o2.start();
      var len=Math.floor(AC.sampleRate*1.2)||0,nb=AC.createBuffer(1,Math.max(1,len),AC.sampleRate),d=nb.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
      var ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
      var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=5;

      var t=AC.currentTime,car=g.car,on=(screen==='play'||screen==='count'),sk=skidAmount();
      var gear=Math.min(3,Math.floor(car.sp/115)),fr=clamp((car.sp-gear*115)/115,0,1.2),rpm=0.22+0.62*fr+gear*0.05+sk*0.18;

      A.o1.frequency.setTargetAtTime(f,t,0.04);A.o2.frequency.setTargetAtTime(f*0.5,t,0.04);
      A.lp.frequency.setTargetAtTime(280+rpm*1500,t,0.05);A.eg.gain.setTargetAtTime(on?0.15:0,t,0.08);
      A.sg.gain.setTargetAtTime(on?sk*0.3:0,t,0.05);A.bp.frequency.setTargetAtTime(1250+sk*700+car.sp*0.8,t,0.06);
    }catch(e){}
  }
  function tone(f,dur,type,vol,f2){

  }
  function sfxHit(p){
    if(!AC||!A)return;
    try{var t=AC.currentTime,s=AC.createBufferSource();s.buffer=A.nb;var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
      var gn=AC.createGain();gn.gain.setValueAtTime(0.7*p,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.3);

  /* --- 進行 --- */
  function startCount(){
    g=Core.makeGame(seed);screen='count';countT=3;countN=4;acc=0;smoke.length=0;treePtr=0;prevW=null;newBest=false;lastSteer=0;
    cam.x=g.car.x;cam.y=g.car.y;cam.a=g.car.h;skidRecenter(true);
  }
  function finish(){
    screen='result';resultT=0;var s=Math.floor(g.score);
    if(s>best){best=s;newBest=true;try{localStorage.setItem('driftTouge.best',String(s));}catch(e){}}
    tone(523,0.15,'triangle',0.2);setTimeout(function(){tone(784,0.3,'triangle',0.2);},150);
  }
  function share(){
    var s=Math.floor(g.score),text='ドリフト峠で '+s+'点（'+Core.rank(s)+'・最長ドリフト'+g.longest.toFixed(1)+'秒）今日のコースは全員おなじ。 #ドリフト峠';
    var url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent('https://nosunosukawa.github.io/drift-touge/');
    try{window.open(url,'_blank','noopener');}catch(e){}
  }
  function update(dt){
    now+=dt;
    if(screen==='count'){
      countT-=dt;var n=Math.ceil(countT);
      if(n<countN&&n>0){countN=n;tone(440,0.12,'square',0.15);}
      if(countT<=0){screen='play';goT=0.7;tone(880,0.3,'square',0.18);}
    }else if(screen==='play'){
      var inp=inputNow();acc+=dt;
      while(acc>=STEP){Core.step(g,inp,STEP);acc-=STEP;}
      for(var i=0;i<g.events.length;i++){var ev=g.events[i];
        if(ev.type==='hit'){sfxHit(ev.power);shake=Math.max(shake,10*ev.power);hitFlash=0.25;}
        else if(ev.type==='combo'){sfxCombo(ev.mult);comboPulse=1;}}
      g.events.length=0;
      if(g.over)finish();
    }else if(screen==='result'){resultT+=dt;}
    if(goT>0)goT-=dt;
    effects(dt);audioUpdate();
  }
  function effects(dt){
    var car=g.car,cs=Math.cos(car.h),sn=Math.sin(car.h),amt=skidAmount();
    /* タイヤ痕 */
    skidRecenter(false);
    var rx=car.x-cs*15,ry=car.y-sn*15,w=[rx+sn*9,ry-cs*9,rx-sn*9,ry+cs*9];
    if(amt>0.06&&prevW){
      skAc.strokeStyle='rgba(10,10,12,'+(0.22+0.4*amt).toFixed(2)+')';skAc.lineWidth=2.3;skAc.lineCap='round';skAc.beginPath();
      skAc.moveTo((prevW[0]-skOx)*SKS,(prevW[1]-skOy)*SKS);skAc.lineTo((w[0]-skOx)*SKS,(w[1]-skOy)*SKS);
      skAc.moveTo((prevW[2]-skOx)*SKS,(prevW[3]-skOy)*SKS);skAc.lineTo((w[2]-skOx)*SKS,(w[3]-skOy)*SKS);skAc.stroke();
    }
    prevW=w;
    /* 白煙 */
    if(amt>0.15&&smoke.length<90){
      var n=amt>0.6?2:1;
      for(var i=0;i<n;i++){var k=Math.random()<0.5?0:2;smoke.push({x:w[k]+(Math.random()-0.5)*6,y:w[k+1]+(Math.random()-0.5)*6,vx:car.vx*0.25+(Math.random()-0.5)*30,vy:car.vy*0.25+(Math.random()-0.5)*30,life:0,max:0.5+Math.random()*0.5,r:5+Math.random()*5});}
    }
    for(var j=smoke.length-1;j>=0;j--){var s=smoke[j];s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=0.96;s.vy*=0.96;s.r+=26*dt;if(s.life>=s.max){smoke[j]=smoke[smoke.length-1];smoke.pop();}}
    /* カメラ */
    var f=1-Math.exp(-dt*6);
    cam.x+=(car.x+car.vx*0.16-cam.x)*f;cam.y+=(car.y+car.vy*0.16-cam.y)*f;
    var b=clamp(car.beta,-1.4,1.4),ta=car.h+b*0.55;
    cam.a+=angDiff(ta,cam.a)*(1-Math.exp(-dt*4.5));
    var tz=1.1-0.2*clamp(car.sp/P.VMAX,0,1)+(g.drifting?0.07:0);
    cam.z+=(tz-cam.z)*(1-Math.exp(-dt*3));
    if(shake>0)shake=Math.max(0,shake-30*dt);
    if(comboPulse>0)comboPulse=Math.max(0,comboPulse-3.5*dt);
    if(hitFlash>0)hitFlash-=dt;
  }

  function drawWorld(){

  function frame(ts){

    if(paused){last=ts;return;}
    var dt=Math.min(Math.max((ts-last)/1000,0),1/30);last=ts;
    update(dt);render();
  }

  /* --- 検証用の覗き口（読み取り専用） --- */
  function rect(b){return {x:b.x,y:b.y,w:b.w,h:b.h};}
  window.__test=Object.freeze({state:function(){
    var c=g.course,car=g.car,ahead=[],inp=inputNow();
    for(var i=car.ci;i<=car.ci+52&&i<c.x.length;i++)ahead.push({x:c.x[i],y:c.y[i],heading:c.h[i],curvature:c.k[i]});
    return {screen:screen,paused:paused,muted:muted,timeLeft:g.t,score:Math.floor(g.score),combo:g.mult,chainTime:g.chain,drifting:g.drifting,nearWall:g.near,
      car:{x:car.x,y:car.y,heading:car.h,vx:car.vx,vy:car.vy,speed:car.sp,kmh:Core.kmh(car.sp),driftAngle:car.beta,yawRate:car.w,steer:car.steer,handbrake:car.hb,lateralOffset:car.lat},
      course:{seed:c.seed,width:2*c.halfW,halfWidth:c.halfW,carRadius:Core.CAR_R,spacing:c.ds,index:car.ci,ahead:ahead},
      wallHits:g.hits,longestDrift:g.longest,maxCombo:g.maxMult,topSpeed:g.topSp,best:best,
      input:{steer:inp.steer,handbrake:inp.hb},view:{w:cw,h:ch},
      buttons:{mute:rect(btn.mute),retry:rect(btn.retry),share:rect(btn.share)}};
  }});

  resize();skidRecenter(true);
  requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();}
</script>
</body>
</html>
